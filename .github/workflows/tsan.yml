name: ThreadSanitizer race hunt

on:
  workflow_dispatch:
  push:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev g++
          python -m pip install --upgrade pip
          pip install numpy scipy "scikit-learn>=1.6" pytest pandas libsvmdata

      - name: Build with -fsanitize=thread
        env:
          SANITIZE: thread
        run: pip install --no-build-isolation -e . -v

      - name: Run focused tests under TSan
        env:
          TSAN_OPTIONS: "halt_on_error=0:detect_deadlocks=0:history_size=7:abort_on_error=0:exitcode=0:report_thread_leaks=0:report_signal_unsafe=0"
        # Don't let a TSan-time crash kill the step before we can collect the log.
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          # Resolve libtsan against the same gcc that built the extension so
          # the ABI matches. Hardcoding libtsan.so.2 broke on this runner.
          LIBTSAN=$(gcc -print-file-name=libtsan.so)
          echo "Preloading $LIBTSAN"
          ls -l "$LIBTSAN" || true
          export LD_PRELOAD="$LIBTSAN"
          # Run the tests that were known to crash. -s keeps output flowing,
          # -p no:cacheprovider avoids unrelated file races in pytest's cache.
          python -m pytest -s -v -p no:cacheprovider \
            test/test_logistic_regression.py::test_max_iter \
            test/test_logistic_regression.py::test_warm_start \
            2>&1 | tee tsan_output.log
          # Don't fail the job on test-runtime exit codes; we just want the report.
          true

      - name: Extract race reports
        if: always()
        run: |
          echo '=== WARNING: ThreadSanitizer summary ==='
          grep -A 40 'WARNING: ThreadSanitizer' tsan_output.log | head -400 || echo 'No race reports captured.'

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: tsan_output.log
