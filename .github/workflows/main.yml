name: Build and upload to PyPI

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 cyanure --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 cyanure --count --max-complexity=10 --max-line-length=110 --statistics

  build_wheels:
    needs: [lint_code]
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
        if: runner.os == 'macOS' && runner.arch == 'ARM64'

      - uses: conda-incubator/setup-miniconda@v3
        if: runner.os == 'macOS'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.19.2

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: To avoid clean up error
        run: sudo rm -rf "/Users/runner/conda_pkgs_dir"
        if: runner.os == 'macOS' && runner.arch == 'ARM64'

      - uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheel-${{ matrix.os }}

  merge_artifact:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Merge wheel artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: wheel
          pattern: wheel-*

  build_sdist:
    needs: [lint_code]
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "PACKAGE_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.9'

      - name: Install build deps
        run: pip install numpy "setuptools>=78.1.1" "wheel>=0.38.1"

      - name: Build sdist
        run: python setup.py sdist

      - uses: actions/upload-artifact@v4
        with:
          path: dist/*
          name: sdist

  test_imports:
    needs: [merge_artifact]
    name: Smoke test for c++ dependencies on raw ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: wheel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Try to import cyanure
        run: pip install setuptools && pip install scipy && pip install numpy && pip install "scikit-learn>=1.6" && python -m pip install --no-index --find-links wheel cyanure && python -c "import cyanure;"

  run_tests:
    needs: [merge_artifact]
    name: Run the tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: wheel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cyanure
        run: pip install setuptools && pip install scipy && pip install numpy && pip install "scikit-learn>=1.6" && python -m pip install --no-index --find-links wheel cyanure

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests without the lib
        uses: knicknic/os-specific-run@v1.0.3
        with:
          macos: rm -rf cyanure && rm -rf cyanure_lib && python -m pip install pytest && python -m pip install pandas && python -m pip install libsvmdata && python -m pytest test/
          linux: rm -rf cyanure && rm -rf cyanure_lib && python -m pip install pytest && python -m pip install pandas && python -m pip install libsvmdata && python -m pytest test/
          windows: Remove-Item -Force -Recurse cyanure && Remove-Item -Force -Recurse cyanure_lib && python -m pip install pytest && python -m pip install libsvmdata && python -m pip install pandas && python -m pytest test/

  release:
    if: github.ref == 'refs/heads/master'
    needs: [build_sdist, test_imports, run_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "PACKAGE_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACKAGE_VERSION }}
          name: ${{ env.PACKAGE_VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/cyanure-${{ env.PACKAGE_VERSION }}.zip
            dist/cyanure-${{ env.PACKAGE_VERSION }}.tar.gz

  upload_pypi:
    if: github.ref == 'refs/heads/master'
    needs: [release, merge_artifact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Drop the .zip sdist
        # PyPI only accepts one sdist per release; we ship the .tar.gz there
        # and keep the .zip on the GitHub release.
        run: rm -f dist/*.zip

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI }}
